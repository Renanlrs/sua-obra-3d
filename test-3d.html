<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>teste 3D arrasto</title>
<style>body{margin:0;font:13px monospace;background:#111;color:#ddd}iframe{width:1100px;height:700px;border:0;display:block}#log{padding:8px;white-space:pre-wrap}</style></head>
<body><iframe id="f" src="index.html?demo=casa-terrea&l=12&p=25&v=fachada&fz=0.9"></iframe><div id="log">…</div>
<script>
/* Arrasta a janela da entrada e o letreiro dentro do app real (iframe, mesma origem) e confere o que foi gravado no projeto. */
var out = [], ok = 0, bad = 0;
function t(n, c, x){ (c ? ok++ : bad++); out.push((c ? 'PASSA' : 'FALHA') + '  ' + n + (x ? '   → ' + x : '')); }
function fim(){ var l = document.getElementById('log'); l.textContent = out.join('\n') + '\n' + ok + ' passaram · ' + bad + ' falharam'; document.title = (bad ? 'FALHOU ' : 'OK ') + ok + '/' + (ok + bad); }
function ev(el, tipo, x, y, extra){ var e = new PointerEvent(tipo, Object.assign({bubbles:true, cancelable:true, clientX:x, clientY:y, pointerId:1, pointerType:'mouse', button:0, buttons:tipo === 'pointerup' ? 0 : 1, isPrimary:true}, extra || {})); el.dispatchEvent(e); }
var f = document.getElementById('f');
f.onload = function () {
  var W = f.contentWindow;
  setTimeout(function () {
    try {
      var UI = W.UI, M = W.M, TRES = W.TRES, t3 = UI.t3, cena = t3._cena(), CM = .01;
      var canvas = f.contentDocument.querySelector('canvas.t3-canvas');
      canvas.setPointerCapture = function(){}; canvas.releasePointerCapture = function(){};
      /* janela do lado da entrada: centro em mundo → tela */
      var pc = cena.an.entrada.pc, ab = pc.ab.filter(function (a) { return a.tipo === 'janela'; })[0];
      t('demo tem janela na parede da entrada', !!ab);
      var cx = (ab.s + ab.e) / 2 * CM, cy = (ab.z0 + ab.z1) / 2 * CM, cz = pc.c * CM - .05;
      var p0 = t3.telaDe(cx, cy, cz), p1 = t3.telaDe(cx - .5, cy, cz);   /* 50 cm para a esquerda (x menor); a porta limita o resto */
      ev(canvas, 'pointerdown', p0.x, p0.y); ev(canvas, 'pointermove', p0.x + (p1.x - p0.x) / 2, p0.y); ev(canvas, 'pointermove', p1.x, p1.y);
      setTimeout(function () {
        ev(canvas, 'pointerup', p1.x, p1.y);
        var o = M.abertura(pc.chave);
        t('arrastar a janela grava pos na parede da entrada', o && o.pos != null, JSON.stringify(o));
        var ab2 = TRES.analise(M.proj, 0).entrada.pc.ab.filter(function (a) { return a.tipo === 'janela'; })[0];
        t('janela andou ~50 cm para a esquerda (±15 cm), sem invadir a porta', ab2 && Math.abs(((ab2.s + ab2.e) / 2) - ((ab.s + ab.e) / 2 - 50)) <= 15 && !TRES.analise(M.proj, 0).entrada.pc.ab.some(function (a) { return a.tipo === 'entrada' && a.e + 15 > ab2.s; }), ab2 ? ((ab2.s + ab2.e) / 2) + ' vs ' + ((ab.s + ab.e) / 2 - 50) : '-');
        t('undo desfaz o arrasto num passo', (function () { M.undo(); return !M.abertura(pc.chave); })());
        ev(canvas, 'pointerdown', p0.x, p0.y); ev(canvas, 'pointerup', p0.x, p0.y);
        var popJ = f.contentDocument.getElementById('fpop');
        t('clique na janela abre o popover dela', popJ && !popJ.hidden && popJ.dataset.fk === 'janela', popJ ? popJ.dataset.fk + ' hidden=' + popJ.hidden : 'sem popover');
        var fp0 = f.contentDocument.getElementById('fpop'); if (fp0) fp0.hidden = true;
        /* letreiro: precisa existir */
        M.proj.fachada = {letreiro:'ACQUA BELO'}; M.commit('let'); t3.verFachada(true, .9);
        setTimeout(function () {
          var L = t3._cena().letreiro; t('letreiro existe na cena', !!L, JSON.stringify(L));
          var q0 = t3.telaDe(L.x, L.y + L.h / 2, L.z - .1), q1 = t3.telaDe(L.x - 1.5, L.y + L.h / 2 - .3, L.z - .1);
          ev(canvas, 'pointerdown', q0.x, q0.y); ev(canvas, 'pointermove', q1.x, q1.y);
          setTimeout(function () {
            ev(canvas, 'pointerup', q1.x, q1.y);
            var F = TRES.fachadaDe(M.proj);
            t('arrastar o letreiro grava letreiroX/letreiroY', F.letreiroX > 0 && F.letreiroY > 0, F.letreiroX + ',' + F.letreiroY);
            t('letreiro foi 1,5 m para a esquerda e 0,3 m para baixo (±10 cm)', Math.abs(F.letreiroX - (L.x - 1.5)) <= .1 && Math.abs(F.letreiroY - (L.y - .3)) <= .1, F.letreiroX + ',' + F.letreiroY + ' vs ' + (L.x - 1.5) + ',' + (L.y - .3));
            /* clique sem mover abre o popover */
            var L2 = t3._cena().letreiro, r0 = t3.telaDe(L2.x, L2.y + L2.h * .85, L2.z - .1);   /* parte de cima da placa (a marquise pode cobrir a de baixo) */
            ev(canvas, 'pointerdown', r0.x, r0.y); var dMov = t3._dbg().mov; ev(canvas, 'pointerup', r0.x, r0.y);
            t('clicar na fachada não pega um móvel escondido atrás da parede', !dMov);
            var pop = f.contentDocument.getElementById('fpop');
            t('clique sem arrastar abre o popover do letreiro', pop && !pop.hidden && pop.dataset.fk === 'letreiro', pop ? pop.dataset.fk + ' hidden=' + pop.hidden : 'sem popover');
            if (fp0) fp0.hidden = true; var fpX = f.contentDocument.getElementById('fpop'); if (fpX) fpX.hidden = true;
            /* ---- cobertura independente: nasce, aparece no 3D, arrasta e é clicável ---- */
            var c1 = W.UI.novaCobertura({nome:'Área da piscina', w:500, h:500, tipo:'duas', pilarMat:'metalico'});
            setTimeout(function () {
              var cena2 = t3._cena(), achou = [];
              cena2.raiz.traverse(function (o) { if (o.userData && o.userData.fk === 'cobAvulsa' && o.userData.fkid === c1.id) achou.push(o); });
              t('a cobertura aparece no 3D com peças clicáveis', achou.length > 0, achou.length + ' peças');
              var alvoY = (c1.alt || 280) * .01 + .3, pz = t3.telaDe((c1.x + c1.w / 2) * .01, alvoY, (c1.y + c1.h / 2) * .01);
              var pz2 = t3.telaDe((c1.x + c1.w / 2) * .01 + 1.5, alvoY, (c1.y + c1.h / 2) * .01);
              var x0c = c1.x;
              ev(canvas, 'pointerdown', pz.x, pz.y); ev(canvas, 'pointermove', pz2.x, pz2.y);
              setTimeout(function () {
                ev(canvas, 'pointerup', pz2.x, pz2.y);
                var c2 = W.M.coberturaDe(c1.id);
                t('arrastar a cobertura no 3D anda ~1,5 m e grava', c2 && Math.abs(c2.x - (x0c + 150)) <= 20, c2 ? c2.x + ' vs ' + (x0c + 150) : 'sumiu');
                t('undo devolve a cobertura para o lugar', (function () { W.M.undo(); return W.M.coberturaDe(c1.id).x === x0c; })());
                var c3 = W.M.coberturaDe(c1.id), pz3 = t3.telaDe((c3.x + c3.w / 2) * .01, alvoY, (c3.y + c3.h / 2) * .01);
                ev(canvas, 'pointerdown', pz3.x, pz3.y); ev(canvas, 'pointerup', pz3.x, pz3.y);
                var popC = f.contentDocument.getElementById('fpop');
                t('clique sem arrastar abre o painel da cobertura (tipo, telha, pilares)', popC && !popC.hidden && popC.dataset.fk === 'cobAvulsa' && /PILARES/.test(popC.textContent), popC ? popC.dataset.fk : 'sem popover');
                var nAntes = W.M.nPilares(c3);
                var btn6 = popC && popC.querySelector('[data-ck="nx"][data-cv="4"]'); if (btn6) btn6.click();
                t('trocar o número de pilares pelo painel muda o projeto e o 3D', W.M.nPilares(W.M.coberturaDe(c1.id)) > nAntes);
                var btnMat = f.contentDocument.querySelector('#fpop [data-ck="pilarMat"][data-cv="madeira"]'); if (btnMat) btnMat.click();
                t('trocar o material do pilar aplica (e a seção volta ao padrão do material)', W.M.cobCfg(W.M.coberturaDe(c1.id)).pilarMat === 'madeira' && W.M.cobCfg(W.M.coberturaDe(c1.id)).pilarEsp === W.M.PILAR_MATS.madeira.esp);
                /* ---- pilar da estrutura não passa do andar que existe naquele ponto (bug do print: pilares soltos) ---- */
                W.M.novo('casa-terrea', 1200, 2500);
                var ambs = W.M.proj.ambientes, bloco = ambs[ambs.length - 1];
                bloco.pav = 1;   /* um bloco vira 2º pavimento; o resto continua térreo */
                W.M.commit('sobrado parcial'); t3.atualizar();
                setTimeout(function () {
                  var cena3 = t3._cena(), H3 = cena3.H, andarH3 = cena3.andarH, altos = [];
                  cena3.G.estrutura.traverse(function (o) {
                    if (!o.isMesh || !o.geometry || !o.geometry.parameters || o.geometry.parameters.width !== .2 || o.geometry.parameters.depth !== .2) return;
                    if (o.geometry.parameters.height < H3 + 1) return;   /* pilar de um andar só: ok */
                    var sobreBloco = o.position.x >= bloco.x * .01 - .3 && o.position.x <= (bloco.x + bloco.w) * .01 + .3 && o.position.z >= bloco.y * .01 - .3 && o.position.z <= (bloco.y + bloco.h) * .01 + .3;
                    if (!sobreBloco) altos.push([o.position.x.toFixed(1), o.position.z.toFixed(1), o.geometry.parameters.height.toFixed(1)].join(','));
                  });
                  t('pilar de bloco térreo não sobe até o andar de cima (nenhum pilar solto no ar)', altos.length === 0, altos.slice(0, 4).join(' | '));
                  /* ---- catálogo inteiro: cada item do catálogo tem que virar peça 3D sem quebrar ---- */
                  var LIB = W.MOVEIS, chaves = Object.keys(LIB.ITENS), erro = null;
                  W.M.proj.moveis = chaves.map(function (k, i) {
                    var d = LIB.def(k);
                    return {id:'t' + i, k:k, x:150 + (i % 12) * 90, y:150 + Math.floor(i / 12) * 90, rot:0, w:d.w, d:d.d, alt:d.alt};
                  });
                  W.M.commit('catálogo inteiro');
                  try { t3.atualizar(); } catch (e2) { erro = e2.message; }
                  setTimeout(function () {
                    var cena4 = t3._cena(), montados = cena4 ? Object.keys(cena4.moveis).length : 0;
                    t('os ' + chaves.length + ' itens do catálogo viram peça 3D sem erro', !erro && montados === chaves.length, erro || (montados + ' de ' + chaves.length));
                    var semMalha = chaves.filter(function (k, i) { var gg = cena4 && cena4.moveis['t' + i]; return !gg || !gg.children.length; });
                    t('nenhum item nasce vazio no 3D', semMalha.length === 0, semMalha.slice(0, 6).join(', '));
                    var semSym = chaves.filter(function (k) { return !LIB.symDe({k:k}); });
                    t('todo item tem figurinha 2D (planta)', semSym.length === 0, semSym.slice(0, 6).join(', '));
                    var semCat = chaves.filter(function (k) { return !LIB.CATS.some(function (c) { return c.k === LIB.def(k).cat; }); });
                    t('todo item está numa categoria existente', semCat.length === 0, semCat.join(', '));
                    var capaRuim = LIB.CATS.filter(function (c) { return !LIB.def(c.capa); });
                    t('toda categoria tem capa válida', capaRuim.length === 0, capaRuim.map(function (c) { return c.k; }).join(', '));
                    /* ---- todos os tipos de janela, porta, portão e muro montam no 3D ---- */
                    W.M.novo('loja', 1200, 2500); W.M.proj.moveis = [];
                    var TF2 = W.TRES, combos = [], falhas = [];
                    Object.keys(TF2.JANELAS).forEach(function (k) { combos.push({janela:k}); });
                    Object.keys(TF2.VIDROS).forEach(function (k) { combos.push({vidro:k}); });
                    Object.keys(TF2.PORTAS).forEach(function (k) { combos.push({porta:k}); });
                    Object.keys(TF2.PORTAS_LOJA).forEach(function (k) { combos.push({porta:k, portaLargura:2.4}); });
                    Object.keys(TF2.PORTAS_INT).forEach(function (k) { combos.push({portaInt:k}); });
                    Object.keys(TF2.GARAGENS).forEach(function (k) { combos.push({garagem:k}); });
                    Object.keys(W.UI ? {} : {}).forEach(function () {});
                    ['grade', 'ripado', 'chapa', 'deslizante', 'lanca', 'perfurada'].forEach(function (k) { combos.push({portao:k}); });
                    ['baixo', 'alto', 'vidro', 'cobogo', 'gradil', 'pedra'].forEach(function (k) { combos.push({muro:k}); });
                    combos.forEach(function (c) {
                      W.M.proj.fachada = c;
                      try { t3.atualizar(); var cn = t3._cena(); if (!cn || !cn.raiz.children.length) falhas.push(JSON.stringify(c)); }
                      catch (e3) { falhas.push(JSON.stringify(c) + ': ' + e3.message); }
                    });
                    t('os ' + combos.length + ' tipos de janela/vidro/porta/porta interna/garagem/portão/muro montam no 3D', falhas.length === 0, falhas.slice(0, 4).join(' | '));
                    W.M.proj.fachada = null; t3.atualizar();
                    fim();
                  }, 600);
                }, 700);
              }, 200);
            }, 500);
          }, 150);
        }, 400);
      }, 150);
    } catch (e) { t('exceção: ' + e.message, false, e.stack); fim(); }
  }, 2500);
};
</script></body></html>
